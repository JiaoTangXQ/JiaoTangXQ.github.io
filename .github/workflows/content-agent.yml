name: Content Agent

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated content instead of draft"
        required: false
        default: "false"
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cyberpunk-ai-daily-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_AGENT_MODEL: ${{ vars.CONTENT_AGENT_MODEL || 'gpt-5.4' }}
          CONTENT_AGENT_AI_SEARCH: ${{ vars.CONTENT_AGENT_AI_SEARCH }}
          CONTENT_AGENT_RSSHUB_BASE: ${{ vars.CONTENT_AGENT_RSSHUB_BASE }}
          CONTENT_AGENT_WECHAT_RSSHUB_ROUTES: ${{ vars.CONTENT_AGENT_WECHAT_RSSHUB_ROUTES }}
          CONTENT_AGENT_VIDEO_RSSHUB_ROUTES: ${{ vars.CONTENT_AGENT_VIDEO_RSSHUB_ROUTES }}
          CONTENT_AGENT_GITHUB_TOKEN: ${{ secrets.CONTENT_AGENT_GITHUB_TOKEN || github.token }}
          FOLO_DATA_API: ${{ vars.FOLO_DATA_API }}
          FOLO_COOKIE: ${{ secrets.FOLO_COOKIE }}
          FOLO_LIST_IDS: ${{ vars.FOLO_LIST_IDS }}
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          EXTRA=""
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then EXTRA="--publish"; fi
          npm run agent:run -- --date="$DATE" --force $EXTRA

      - name: Generate weekly on Sunday
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_AGENT_MODEL: ${{ vars.CONTENT_AGENT_MODEL || 'gpt-5.4' }}
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          DOW="$(TZ=Asia/Shanghai date +%u)"
          if [ "$DOW" = "7" ]; then
            WEEK="$(TZ=Asia/Shanghai date +%G-W%V)"
            npm run agent:weekly -- --date="$DATE" --week="$WEEK" --force
          fi

      - name: Commit generated content
        run: |
          if [ -n "$(git status --porcelain src/content public/generated)" ]; then
            git config user.name "content-agent"
            git config user.email "content-agent@users.noreply.github.com"
            git add src/content public/generated
            git commit -m "chore: generate AI content"
            git push
          fi
