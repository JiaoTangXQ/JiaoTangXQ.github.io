name: Build server branch

on:
  push:
    branches: [server]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'http://121.40.108.230' }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
        run: npm run build:server

      - uses: actions/upload-artifact@v4
        with:
          name: jiaotang-planet-dist
          path: dist
